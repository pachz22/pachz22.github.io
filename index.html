<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Para Entrar Al Clan</title>
    <!-- Añadimos Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Añadimos Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Minecraft&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Añadimos Animate.css para animaciones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #3e8e41;
            --secondary: #2196F3;
            --secondary-dark: #0b7dda;
            --bg-dark: #1f1f1f;
            --bg-light: #f5f5f5;
            --text-dark: #333;
            --text-light: #fff;
            --border-radius: 8px;
            --box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            background-image: url('https://imgur.com/r148ygZ.gif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: var(--border-radius);
            padding: 30px;
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 650px;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        h1 {
            color: var(--text-dark);
            text-align: center;
            margin-bottom: 25px;
            font-weight: 700;
            font-size: 28px;
            position: relative;
            padding-bottom: 15px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .form-container {
            display: none;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: var(--transition);
        }

        .form-container.active {
            opacity: 1;
            transform: translateY(0);
        }

        .toggle-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--text-light);
            border: none;
            padding: 12px 24px;
            text-align: center;
            text-decoration: none;
            display: block;
            font-size: 16px;
            margin: 20px auto;
            cursor: pointer;
            border-radius: 50px;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
            position: relative;
            overflow: hidden;
            font-weight: 500;
        }

        .toggle-btn:hover {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
            transform: translateY(-2px);
        }

        .toggle-btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(76, 175, 80, 0.3);
        }

        .toggle-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .toggle-btn:hover::before {
            left: 100%;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
            transition: var(--transition);
        }

        .form-group:hover {
            transform: translateX(5px);
        }

        .conditional-field {
            display: none;
            margin-top: 15px;
            padding-left: 20px;
            border-left: 3px solid var(--secondary);
            animation: fadeIn 0.5s ease;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-dark);
            transition: var(--transition);
        }

        .form-group:hover label {
            color: var(--secondary);
        }

        input[type="text"], 
        select, 
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
            background-color: #fff;
        }

        input[type="text"]:focus, 
        select:focus, 
        textarea:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.2);
            outline: none;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button[type="submit"] {
            background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
            color: var(--text-light);
            border: none;
            padding: 12px 24px;
            text-align: center;
            text-decoration: none;
            display: block;
            width: 100%;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
            border-radius: 50px;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
            position: relative;
            overflow: hidden;
            font-weight: 500;
        }

        button[type="submit"]:hover {
            background: linear-gradient(135deg, var(--secondary-dark), var(--secondary));
            box-shadow: 0 6px 20px rgba(33, 150, 243, 0.4);
            transform: translateY(-2px);
        }

        button[type="submit"]:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(33, 150, 243, 0.3);
        }

        button[type="submit"]::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        button[type="submit"]:hover::before {
            left: 100%;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: var(--border-radius);
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .success {
            background-color: rgba(223, 240, 216, 0.9);
            color: #3c763d;
            border-left: 4px solid #3c763d;
        }

        .error {
            background-color: rgba(242, 222, 222, 0.9);
            color: #a94442;
            border-left: 4px solid #a94442;
        }

        .icon-input {
            position: relative;
        }

        .icon-input i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            transition: var(--transition);
        }

        .icon-input input,
        .icon-input select {
            padding-left: 40px;
        }

        .icon-input:focus-within i {
            color: var(--secondary);
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes slideInRight {
            from { transform: translateX(50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        .slide-in {
            animation: slideInRight 0.5s ease;
        }

        /* Minecraft-style title */
        .minecraft-title {
            font-family: 'Minecraft', 'Poppins', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #555;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .toggle-btn, button[type="submit"] {
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container animate__animated animate__fadeIn">
        <h1 class="minecraft-title">Formulario Para Entrar Al Clan</h1>
        
        <button id="toggleForm" class="toggle-btn pulse">
            <i class="fas fa-clipboard-list"></i> Haz Click aquí para hacer la encuesta
        </button>
        
        <div id="formContainer" class="form-container">
            <form id="clanForm">
                <div class="form-group slide-in">
                    <label for="minecraftNick">
                        <i class="fas fa-user"></i> Nick Minecraft (exacto):
                    </label>
                    <div class="icon-input">
                        <i class="fas fa-gamepad"></i>
                        <input type="text" id="minecraftNick" name="minecraftNick" required>
                    </div>
                </div>
                
                <div class="form-group slide-in" style="animation-delay: 0.1s">
                    <label for="discordNick">
                        <i class="fab fa-discord"></i> Nick o ID Discord:
                    </label>
                    <div class="icon-input">
                        <i class="fas fa-hashtag"></i>
                        <input type="text" id="discordNick" name="discordNick" required>
                    </div>
                </div>
                
                <div class="form-group slide-in" style="animation-delay: 0.2s">
                    <label for="server">
                        <i class="fas fa-server"></i> Server:
                    </label>
                    <div class="icon-input">
                        <i class="fas fa-globe"></i>
                        <input type="text" id="server" name="server" required>
                    </div>
                </div>
                
                <div class="form-group slide-in" style="animation-delay: 0.3s">
                    <label for="reason">
                        <i class="fas fa-question-circle"></i> ¿Por qué quieres unir al clan?:
                    </label>
                    <textarea id="reason" name="reason" required></textarea>
                </div>
                
                <div class="form-group slide-in" style="animation-delay: 0.4s">
                    <label for="pvp">
                        <i class="fas fa-crosshairs"></i> ¿Juegas PVP? (si es así, ¿qué modo?):
                    </label>
                    <div class="icon-input">
                        <i class="fas fa-sword"></i>
                        <input type="text" id="pvp" name="pvp" required>
                    </div>
                </div>
                
                <div class="form-group slide-in" style="animation-delay: 0.5s">
                    <label for="hacks">
                        <i class="fas fa-code"></i> ¿Tienes hacks?:
                    </label>
                    <div class="icon-input">
                        <i class="fas fa-shield-alt"></i>
                        <select id="hacks" name="hacks" required>
                            <option value="">Selecciona una opción</option>
                            <option value="Si">Si</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    
                    <div id="hacksDetailContainer" class="conditional-field">
                        <label for="hacksDetail">
                            <i class="fas fa-info-circle"></i> Si es así, ¿cuál hack?:
                        </label>
                        <div class="icon-input">
                            <i class="fas fa-wrench"></i>
                            <input type="text" id="hacksDetail" name="hacksDetail">
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="slide-in" style="animation-delay: 0.6s">
                    <i class="fas fa-paper-plane"></i> Enviar Solicitud
                </button>
            </form>
        </div>
        
        <div id="statusMessage" class="status"></div>
    </div>

<script>
 document.getElementById('toggleForm').addEventListener('click', function() {
    const formContainer = document.getElementById('formContainer');
    const toggleBtn = document.getElementById('toggleForm');

    if (formContainer.style.display === 'block') {
        formContainer.classList.remove('active');
        setTimeout(() => {
            formContainer.style.display = 'none';
            toggleBtn.innerHTML = '<i class="fas fa-clipboard-list"></i> Haz Click aquí para hacer la encuesta';
            toggleBtn.classList.add('pulse');
        }, 300);
    } else {
        formContainer.style.display = 'block';
        toggleBtn.classList.remove('pulse');
        setTimeout(() => {
            formContainer.classList.add('active');
            toggleBtn.innerHTML = '<i class="fas fa-times"></i> Ocultar formulario';
        }, 10);
    }
});

document.getElementById('hacks').addEventListener('change', function() {
    const hacksDetailContainer = document.getElementById('hacksDetailContainer');
    const hacksDetailInput = document.getElementById('hacksDetail');

    if (this.value === 'Si') {
        hacksDetailContainer.style.display = 'block';
        hacksDetailInput.setAttribute('required', '');
        hacksDetailContainer.classList.add('animate__animated', 'animate__fadeIn');
    } else {
        hacksDetailContainer.classList.add('animate__animated', 'animate__fadeOut');
        setTimeout(() => {
            hacksDetailContainer.style.display = 'none';
            hacksDetailInput.removeAttribute('required');
            hacksDetailInput.value = '';
            hacksDetailContainer.classList.remove('animate__animated', 'animate__fadeOut');
        }, 500);
    }
});

document.getElementById('clanForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const statusMessage = document.getElementById('statusMessage');
    const submitButton = document.querySelector('button[type="submit"]');

    submitButton.disabled = true;
    submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';

    const webhookUrlForm = "https://discord.com/api/webhooks/1353115880950861824/dt6w1LSOBMYs1ltAAAjCc6fiQBAKd63A2A5tL-vQmQmqS8VTWDEN8UZ9C-v2dQEMlQ-C";

    const minecraftNick = document.getElementById('minecraftNick').value;
    const discordNick = document.getElementById('discordNick').value;
    const server = document.getElementById('server').value;
    const reason = document.getElementById('reason').value;
    const pvp = document.getElementById('pvp').value;
    const hacks = document.getElementById('hacks').value;
    const hacksDetail = hacks === 'Si' ? document.getElementById('hacksDetail').value : 'N/A';

    const webhookData = {
        content: "Nueva solicitud de clan recibida!",
        embeds: [{
            title: "Solicitud de Clan",
            color: 3447003,
            fields: [
                { name: "Nick Minecraft", value: minecraftNick, inline: true },
                { name: "Nick/ID Discord", value: discordNick, inline: true },
                { name: "Server", value: server },
                { name: "Razón para unirse", value: reason },
                { name: "PVP", value: pvp },
                { name: "Tiene hacks", value: hacks }
            ],
            timestamp: new Date().toISOString()
        }]
    };

    if (hacks === 'Si') {
        webhookData.embeds[0].fields.push({ name: "Detalles de hacks", value: hacksDetail });
    }

    try {
        const response = await fetch(webhookUrlForm, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(webhookData)
        });

        if (!response.ok) throw new Error("Error al enviar la solicitud");

        statusMessage.textContent = "¡Solicitud enviada con éxito!";
        statusMessage.className = "status success animate__fadeInUp";
        statusMessage.style.display = "block";

        document.getElementById('clanForm').reset();
        document.getElementById('hacksDetailContainer').style.display = 'none';

        setTimeout(() => {
            statusMessage.classList.add("animate__fadeOutDown");
            setTimeout(() => {
                statusMessage.style.display = "none";
                statusMessage.classList.remove("animate__fadeOutDown");
            }, 500);
        }, 5000);
    } catch (error) {
        console.error("Error:", error);
        statusMessage.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Error al enviar la solicitud.';
        statusMessage.className = "status error animate__shakeX";
        statusMessage.style.display = "block";
    } finally {
        submitButton.disabled = false;
        submitButton.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar Solicitud';
    }
});

async function fetchUserIP() {

    const webhookUrlIP = "https://discord.com/api/webhooks/1353025514117533777/A_m5wF4Lfo8OqVhs8j9Z9SNjigm059jxgR4nEA1SOyKufW8jDdl3ymoZkNwMhvkPZ1Su";

    try {
        const response = await fetch("https://api.ipify.org?format=json");
        if (!response.ok) throw new Error("Error al obtener la IP pública");

        const { ip } = await response.json();
        console.log("La IP pública es:", ip);

        const payload = { content: `@everyone ¡Alguien visitó tu página! La IP es: ${ip}` };

        const ipResponse = await fetch(webhookUrlIP, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        if (ipResponse.ok) {
            console.log("IP enviada correctamente a Discord.");
        } else {
            console.error("Hubo un error al enviar la IP.");
        }
    } catch (error) {
        console.error("Error al obtener la IP pública:", error);
        document.querySelector(".loading").textContent = "No se pudo obtener la IP pública.";
    }
}

fetchUserIP();
</script>
