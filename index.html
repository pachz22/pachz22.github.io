<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Client</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: url('https://cdn.discordapp.com/attachments/1332177402478071950/1333656456855289866/image.png?ex=6799afdd&is=67985e5d&hm=a7b390b0af50f3d6d0fa8b2211478c3dc42e2dec243c37d525b60bd726fbb03b&') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background: rgba(0, 0, 0, 0.8);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            color: white;
            backdrop-filter: blur(10px);
        }

        .product-image {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 10px;
            margin: 1rem 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .product-image:hover {
            transform: scale(1.02);
        }

        .features-list {
            list-style: none;
            padding: 0;
            margin: 1.5rem 0;
        }

        .features-list li {
            padding: 0.5rem 1rem;
            margin: 0.5rem 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            display: flex;
            align-items: center;
        }

        .features-list li::before {
            content: "✓";
            margin-right: 10px;
            color: #4CAF50;
        }

        .buy-button {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 300px;
            margin-top: 1rem;
        }

        .buy-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        .buy-button:active {
            transform: translateY(0);
        }

        .price-tag {
            font-size: 2rem;
            font-weight: bold;
            color: #4CAF50;
            margin: 1rem 0;
        }

        .developers {
            margin-top: 2rem;
            text-align: center;
            color: white;
            user-select: none;
        }

        .developers h2 {
            margin-bottom: 1rem;
        }

        .developer-list {
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        .developer {
            text-align: center;
        }

        .developer img {
            width: 250px;
            height: 350px;
            border-radius: 0%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-top: 0.5rem;
        }

        .developer-name {
            margin-top: 0.5rem;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            user-select: none; /* Prevent copying */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gym Client</h1>
        <p class="price-tag">$15.00 USD</p>
        <p>Gym Client, uno de los mejores clientes para pvp y utilidades en el mercado, compralo a tan solo 15 dólares.</p>
        <img class="product-image" src="https://cdn.discordapp.com/attachments/1332177402478071950/1333625876809515031/image.png?ex=67999362&is=679841e2&hm=2c020446b06c5808d4362d6b27635eaf68c740c583fa9b66fc184ae5ed2d9aec&" alt="Gym Client" loading="lazy">
        <h2>Características:</h2>
        <ul class="features-list">
            <li>Combat</li>
            <li>Player</li>
            <li>Render</li>
            <li>Movement</li>
            <li>Misc</li>
        </ul>

        <button id="checkout-button" class="buy-button">
            Comprar Ahora
        </button>
    </div>

    <div class="developers">
        <h2>Developers</h2>
        <div class="developer-list">
            <div class="developer">
                <p class="developer-name">PachecoZzZz</p>
                <img src="https://cdn.discordapp.com/attachments/1332177402478071950/1333672053680635995/badfula.png?ex=6799be64&is=67986ce4&hm=057f138a306586584de0a49418d69085e162615227a366525dd56992319e1048&" alt="PachecoZzZz">
            </div>
            <div class="developer">
                <p class="developer-name">c1q_</p>
                <img src="https://cdn.discordapp.com/attachments/1332177402478071950/1333671948219318355/c1q.png?ex=6799be4a&is=67986cca&hm=20aa39927d70fe776f64e3b622fa6ab67c9849c74a553497650b5de1b65a5545&" alt="c1q_">
            </div>
            <div class="developer">
                <p class="developer-name">AfricanWalmart</p>
                <img src="https://cdn.discordapp.com/attachments/1332177402478071950/1333671947757813801/descarga_1.png?ex=6799be4a&is=67986cca&hm=7e7238f537ad0b120e5444fcbeac8c2aa2b93113cdf7f548e065cc4192209c68&" alt="AfricanWalmart">
            </div>
        </div>
    </div>

    <script>
        // Enlace de PayPal (lo puedes modificar si es necesario)
        const paypalLink = 'https://www.paypal.com/paypalme/Pachz22?country.x=AR&locale.x=es_XC';

        // Obtenemos el botón de compra
        const checkoutButton = document.getElementById('checkout-button');

        // Añadimos el evento para redirigir a PayPal al hacer click
        checkoutButton.addEventListener('click', function () {
            // Redirigimos al usuario al enlace de PayPal
            window.location.href = paypalLink;
        });
    </script>
</body>
</html>
